<!doctype html>
<!-- Browser editor for one document already saved in Google Sheets. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Edit scanned document</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6fa; color: #18263a; font: 16px system-ui, sans-serif; }
    main { max-width: 64rem; margin: auto; padding: 1rem; }
    h1 { margin: .2rem 0; font-size: clamp(1.4rem, 4vw, 2rem); }
    p { margin: .45rem 0; }
    .kicker { color: #164f88; font-size: .8rem; font-weight: 750; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
    button { min-height: 44px; padding: .5rem .85rem; border: 1px solid #7388a0; border-radius: .45rem;
      background: white; color: #18263a; font: inherit; font-weight: 650; }
    button[type="submit"] { color: white; background: #164f88; }
    button:disabled { opacity: .6; }
    #status[data-tone="error"] { color: #9c2121; }
    #status[data-tone="success"] { color: #165d43; }
    .grid { overflow: auto; max-height: 66vh; border: 1px solid #ccd7e4; border-radius: .45rem; background: white; }
    table { border-collapse: separate; border-spacing: 0; width: 100%; }
    th, td { border-bottom: 1px solid #ccd7e4; border-right: 1px solid #ccd7e4; }
    th { text-align: start; padding: .6rem; background: #e5f0fb; white-space: nowrap; }
    thead th { position: sticky; top: 0; z-index: 1; }
    td { padding: 0; }
    textarea { display: block; resize: vertical; min-width: 8rem; width: 100%; min-height: 44px;
      padding: .6rem; border: 0; background: transparent; color: inherit; font: inherit; }
    textarea:focus { outline: 2px solid #164f88; outline-offset: -2px; background: #f2f7ff; }
  </style>
  <script src="/document-editor.js" defer></script>
</head>
<body>
  <main>
    <p class="kicker">SMART DOCUMENT SCANNER</p>
    <h1>Edit document</h1>
    <p>Tap a cell to edit it. Save to update the connected Google spreadsheet.</p>
    <form>
      <!-- The script enables Save after a cell changes. -->
      <div class="controls">
        <button type="submit" id="save" disabled>Save to Google Sheets</button>
        <button type="button" id="reload">Reload from Sheets</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <!-- The script adds the headings and rows after the document loads. -->
      <div class="grid" hidden>
        <table aria-label="Document records">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </form>
  </main>
</body>
</html>
